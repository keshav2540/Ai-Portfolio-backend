[project]
name = "ai-portfolio-backend"
version = "0.1.0"
description = "FastAPI backend for the AI portfolio (resume chatbot + JD matcher)"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pypdf>=6.0.0",
    "python-docx",
    "python-dotenv",
    "pymongo>=4.18.2",
    "qdrant-client>=1.20.0",
    "httpx",
    "langchain-groq>=1.1.3",
    "groq>=0.37.0",
    "pillow>=10.0.0",
]
